name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tide_build:
    name: tide_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate composer configuration
        run: composer validate --ansi --strict --no-check-all --no-check-lock

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Start DDEV
        run: ddev start -y

      - name: Build Drupal site (poser)
        run: ddev poser

      - name: Symlink profile into the site
        run: ddev symlink-project

      - name: Install site with the Tide profile
        run: ddev install-site

      - name: Verify installation
        run: |
          ddev drush status --fields=bootstrap,install-profile,drupal-version
          ddev drush pm:list --status=enabled --filter=tide

  # TODO: export_config previously used the ahoy-based reusable workflow
  # (dpc-sdp/github-actions/.github/workflows/export_config.yml) and needs a
  # DDEV-based rewrite before this branch is merged.
