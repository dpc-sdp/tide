name: 'Tide'
description: 'Tide profile.'
type: profile
package: Tide
core_version_requirement: ^11
dependencies:
  - dpc-sdp:tide_core
  - dpc-sdp:tide_alert
  - dpc-sdp:tide_api
  - dpc-sdp:tide_media
  - dpc-sdp:tide_webform
  - dpc-sdp:tide_event
  - dpc-sdp:tide_news
  - dpc-sdp:tide_landing_page
  - dpc-sdp:tide_publication
  - dpc-sdp:tide_search
  - dpc-sdp:tide_site
# Tide's install hooks enable these modules. Include them in the initial batch
# to avoid nested installs resetting Drupal 11's container partway through it.
install:
  - tide_tfa
  - view_password
  # Required by the shipped data importer permissions and publication fields.
  - workbench
  - tide_data_driven_component
themes:
  - claro
